spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: inscribe-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      repositories:
        enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
  compression:
    enabled: true
    min-response-size: 1024
  tomcat:
    connection-timeout: 10s

spring.lifecycle:
  timeout-per-shutdown-phase: 30s

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}

aws:
  region: ${AWS_REGION:ap-south-1}
  s3-bucket: ${AWS_S3_BUCKET}
  max-upload-size-bytes: ${AWS_S3_MAX_UPLOAD_SIZE_BYTES:10485760}
  upload-url-duration-minutes: ${AWS_S3_UPLOAD_URL_DURATION_MINUTES:10}
  view-url-duration-minutes: ${AWS_S3_VIEW_URL_DURATION_MINUTES:60}
  allowed-content-types: ${AWS_S3_ALLOWED_CONTENT_TYPES:image/png,image/jpeg,image/webp}

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS}
  oauth:
    success-redirect-url: ${OAUTH_SUCCESS_REDIRECT_URL:http://localhost:5173/oauth/callback}
    failure-redirect-url: ${OAUTH_FAILURE_REDIRECT_URL:http://localhost:5173/oauth/callback}
  redis:
    enabled: ${REDIS_ENABLED:false}
    blog-ttl-minutes: ${REDIS_BLOG_TTL_MINUTES:10}
    rate-limit-requests: ${REDIS_RATE_LIMIT_REQUESTS:10}
    rate-limit-window-seconds: ${REDIS_RATE_LIMIT_WINDOW_SECONDS:60}
    likes-sync-interval-ms: ${REDIS_LIKES_SYNC_INTERVAL_MS:60000}
